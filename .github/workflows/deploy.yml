name: Deploy Laravel (cPanel SSH)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📤 Upload files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: .,!.git,!.github,!.gitignore,!.env,!.docker-compose.yml,!.Dockerfile,!.README.md,!.log,!.zip,!.node_modules,!.vendor
          target: 'public_html/subdomains/osis.testing'
          rm: false

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd public_html/subdomains/osis.testing

            echo "📥 Pull latest code"
            git pull origin main

            echo "📦 Install dependencies"
            composer install --no-dev --optimize-autoloader
            npm run build

            echo "🔗 Storage link"
            php artisan storage:link || true

            echo "⚙️ Laravel setup"
            php artisan migrate --force
            php artisan db:seed --force

            echo "🧹 Optimize"
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "🔄 Restart queue (if running)"
            php artisan queue:restart || true

            echo "✅ Deployment completed!!"
